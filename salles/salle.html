<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grottes des Canalettes</title>

  <link rel="stylesheet" href="../style.css">
</head>

<body class="salle-page">

  <main class="conteneur-salle">

    <a href="../index.html" class="retour-accueil">
      🏠 Accueil
    </a>

    <h1 id="titre-salle">Chargement...</h1>

    <div class="choix-visite">
      <button id="bouton-audio" class="bouton-visite actif">
        🎧 Écouter
      </button>

      <button id="bouton-texte" class="bouton-visite">
        📖 Lire
      </button>
    </div>

    <section id="bloc-audio" class="bloc-visite">
      <audio id="lecteur-audio" controls>
        <source id="source-audio" src="" type="audio/mpeg">
        Votre navigateur ne prend pas en charge la lecture audio.
      </audio>

      <p id="message-audio">
        Utilisez le lecteur ci-dessus pour écouter la visite.
      </p>
    </section>

    <section id="bloc-texte" class="bloc-visite" style="display: none;">
      <div id="texte-salle"></div>
    </section>

    <!-- NAVIGATION ENTRE LES SALLES -->
    <nav class="navigation-salles">

      <a id="bouton-precedent" class="navigation-salle precedent" href="#">
        ← Salle précédente
      </a>

      <a id="bouton-suivant" class="navigation-salle suivant" href="#">
        Salle suivante →
      </a>

    </nav>

    <a href="../index.html" class="retour-accueil bas">
      🏠 Retour à l'accueil
    </a>

  </main>

  <script>
    const params = new URLSearchParams(window.location.search);

    const langue = params.get("lang") || "fr";
    const salleActuelle = params.get("salle");

    /*
      ORDRE OFFICIEL DU PARCOURS
    */
    const parcours = [
      "galerie-acces",
      "salle-fontaine",
      "couloir-des-cupules",
      "salle-blanche",
      "salle-du-balcon",
      "armandines",
      "lac-aux-atolls",
      "petit-lac",
      "salle-du-temple-angkor",
      "balcon-des-tenebres",
      "plafond-des-excentriques"
    ];

    const boutonAudio = document.getElementById("bouton-audio");
    const boutonTexte = document.getElementById("bouton-texte");

    const blocAudio = document.getElementById("bloc-audio");
    const blocTexte = document.getElementById("bloc-texte");

    const lecteurAudio = document.getElementById("lecteur-audio");
    const sourceAudio = document.getElementById("source-audio");

    const titreSalle = document.getElementById("titre-salle");
    const texteSalle = document.getElementById("texte-salle");

    const boutonPrecedent = document.getElementById("bouton-precedent");
    const boutonSuivant = document.getElementById("bouton-suivant");

    /*
      BOUTON AUDIO
    */
    boutonAudio.addEventListener("click", () => {

      boutonAudio.classList.add("actif");
      boutonTexte.classList.remove("actif");

      blocAudio.style.display = "block";
      blocTexte.style.display = "none";

    });

    /*
      BOUTON TEXTE
    */
    boutonTexte.addEventListener("click", () => {

      boutonTexte.classList.add("actif");
      boutonAudio.classList.remove("actif");

      blocTexte.style.display = "block";
      blocAudio.style.display = "none";

    });

    /*
      NAVIGATION ENTRE LES SALLES
    */
    function configurerNavigation() {

      const index = parcours.indexOf(salleActuelle);

      if (index === -1) {
        boutonPrecedent.style.display = "none";
        boutonSuivant.style.display = "none";
        return;
      }

      /*
        SALLE PRÉCÉDENTE
      */
      if (index > 0) {

        const sallePrecedente = parcours[index - 1];

        boutonPrecedent.href =
          `salle.html?lang=${langue}&salle=${sallePrecedente}`;

        boutonPrecedent.style.display = "flex";

      } else {

        boutonPrecedent.style.display = "none";

      }

      /*
        SALLE SUIVANTE
      */
      if (index < parcours.length - 1) {

        const salleSuivante = parcours[index + 1];

        boutonSuivant.href =
          `salle.html?lang=${langue}&salle=${salleSuivante}`;

        boutonSuivant.style.display = "flex";

      } else {

        boutonSuivant.style.display = "none";

      }

    }

    /*
      CHARGEMENT DU TEXTE
    */
    async function chargerSalle() {

      try {

        const reponse = await fetch(`../textes/${langue}.json`);

        if (!reponse.ok) {
          throw new Error("Impossible de charger le fichier de langue.");
        }

        const data = await reponse.json();

        if (!data.salles || !data.salles[salleActuelle]) {

          titreSalle.textContent = "Erreur : salle introuvable";
          blocAudio.style.display = "none";
          blocTexte.style.display = "none";

          return;
        }

        const contenu = data.salles[salleActuelle];

        /*
          TITRE
        */
        titreSalle.textContent = contenu.titre;

        /*
          TEXTE
        */
        texteSalle.innerHTML = "";

        if (contenu.texte) {

          const paragraphes = contenu.texte.split("\n\n");

          paragraphes.forEach(paragraphe => {

            const p = document.createElement("p");

            p.textContent = paragraphe;

            texteSalle.appendChild(p);

          });

        }

        /*
          AUDIO
        */
        if (contenu.audio) {

          sourceAudio.src = contenu.audio;

          lecteurAudio.load();

          blocAudio.style.display = "block";

          boutonAudio.style.display = "inline-flex";

        } else {

          blocAudio.style.display = "none";

          boutonAudio.style.display = "none";

          boutonTexte.classList.add("actif");
          blocTexte.style.display = "block";

        }

        /*
          NAVIGATION
        */
        configurerNavigation();

      } catch (erreur) {

        console.error(erreur);

        titreSalle.textContent = "Erreur de chargement";

        blocAudio.style.display = "none";
        blocTexte.style.display = "none";

      }

    }

    chargerSalle();

  </script>

</body>
</html>
